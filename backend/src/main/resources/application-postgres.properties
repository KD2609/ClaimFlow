# Supabase Hosted PostgreSQL Production Profile
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.jqxxiexnlybfgvewpkyq.supabase.co:5432/postgres?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Python SimPy Discrete-Event Simulation Service
simulation.service.url=${SIMULATION_SERVICE_URL:https://claimflow-7gk2.onrender.com}

# Hibernate / JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Hikari Connection Pool Settings for Supabase
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
