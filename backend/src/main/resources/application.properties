spring.application.name=insurance-claim-automation
server.port=8080

# Default to in-memory PostgreSQL-compatible mode for instant zero-config startup and testing
# To connect to Supabase PostgreSQL, set SPRING_PROFILES_ACTIVE=postgres
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT Security
app.jwt.secret=SuperSecretKeyForInsuranceClaimOperationsResearchProjectMustBeAtLeast256BitsLong
app.jwt.expiration-ms=86400000

# Python SimPy Simulation Engine URL
simulation.service.url=${SIMULATION_SERVICE_URL:http://localhost:8000}

# Logging
logging.level.com.orproject.claim=INFO
logging.level.org.springframework.security=WARN
