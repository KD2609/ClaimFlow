spring.application.name=insurance-claim-automation

# Server port and binding (Render dynamically assigns $PORT)
server.port=${PORT:8080}
server.address=0.0.0.0

# Active Spring Profile: 'dev' for local H2 mode, 'postgres' for Supabase PostgreSQL
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configurable CORS Allowed Origins (Comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://claim-flow-self.vercel.app,https://claim-flow-gamma.vercel.app,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Demo Data Seeding flag (Explicitly disabled in production; only enabled when set to true or demo profile)
claimflow.seed-demo-data=${SEED_DEMO_DATA:false}

# Request and error security constraints
server.error.include-stacktrace=never
server.error.include-message=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Python SimPy Simulation Engine URL
simulation.service.url=${SIMULATION_SERVICE_URL:https://claimflow-7gk2.onrender.com}

# Logging
logging.level.com.orproject.claim=INFO
logging.level.org.springframework.security=WARN
